name: PromptOpt-SLM CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy>=1.24 pandas>=2.0 scikit-learn>=1.3 matplotlib>=3.7 streamlit>=1.35 pytest>=7.0

      - name: Run unit test suite with pytest
        run: |
          pytest tests/ -v

      - name: Run standalone runner check
        run: |
          python tests/run_tests.py

      - name: Smoke test experiment pipeline
        run: |
          python -m experiments.run_demo

      - name: Verify outputs generated
        shell: bash
        run: |
          test -f results/demo_summary.json || exit 1
          test -f results/demo_method_comparison.csv || exit 1
          test -f results/figures/fig_method_comparison.png || exit 1
